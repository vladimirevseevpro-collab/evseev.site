<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Статичный 3D-рендер: Настраиваемая точилка v2.0 (Лазерная резка + S608-2RS)</title>
  <style>
    body {
      margin: 0; background: #eef2f6; font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh;
    }
    #toolbar {
      margin: 12px 0; display: flex; gap: 12px; align-items: center;
      background: #fff; padding: 10px 18px; border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08); border: 1px solid #cbd5e1;
    }
    button {
      background: #0f172a; color: #fff; border: none; padding: 10px 16px;
      border-radius: 6px; font-weight: 700; cursor: pointer; font-size: 13px;
    }
    button:hover { background: #1e293b; }
    .wing-btn { background: #e2e8f0; color: #0f172a; }
    .wing-btn.active { background: #d97706; color: #fff; }
    #canvas-wrap {
      position: relative; width: 1200px; height: 750px;
      border-radius: 12px; overflow: hidden;
      box-shadow: 0 20px 50px rgba(15, 23, 42, 0.18); border: 2px solid #94a3b8;
      background: #f8fafc;
    }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="toolbar">
    <strong style="color:#0f172a; font-size:14px;">Профиль крыла копира (Настройка под изгиб ножа):</strong>
    <button class="wing-btn" onclick="setWingAngle(0, this)">0° Прямой (Nakiri)</button>
    <button class="wing-btn" onclick="setWingAngle(15, this)">15° Японский (Santoku)</button>
    <button class="wing-btn active" onclick="setWingAngle(25, this)">25° Шеф-нож (Solingen)</button>
    <button class="wing-btn" onclick="setWingAngle(35, this)">35° Охотничий (Skinner)</button>
    <button onclick="downloadPNG()">💾 Скачать статичную 3D-картинку (PNG)</button>
  </div>

  <div id="canvas-wrap">
    <canvas id="posterCanvas" width="2400" height="1500"></canvas>
  </div>

<script>
// Создаем 3D-сцену в высоком разрешении (2400x1500) для четкой статичной картинки
const outCanvas = document.getElementById('posterCanvas');
const ctx2d = outCanvas.getContext('2d');

const webglCanvas = document.createElement('canvas');
webglCanvas.width = 2400;
webglCanvas.height = 1500;

const renderer = new THREE.WebGLRenderer({ canvas: webglCanvas, antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setSize(2400, 1500);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;

const scene = new THREE.Scene();

// Изометрическая ортографическая камера (настоящий технический 3D-чертеж без искажений)
const aspect = 2400 / 1500;
const d = 14.5;
const camera = new THREE.OrthographicCamera(-d * aspect, d * aspect, d, -d, 1, 200);
camera.position.set(26, 22, 28);
camera.lookAt(0, 2.2, 0);

// Студийное освещение
scene.add(new THREE.AmbientLight(0xffffff, 0.75));
const dirLight = new THREE.DirectionalLight(0xffffff, 1.15);
dirLight.position.set(20, 35, 25);
dirLight.castShadow = true;
dirLight.shadow.mapSize.set(2048, 2048);
dirLight.shadow.camera.left = -25;
dirLight.shadow.camera.right = 25;
dirLight.shadow.camera.top = 25;
dirLight.shadow.camera.bottom = -25;
scene.add(dirLight);

const fillLight = new THREE.DirectionalLight(0xbae6fd, 0.5);
fillLight.position.set(-25, 15, -10);
scene.add(fillLight);

// Материалы (Шлифованная сталь 1.4301, Черный анодированный металл, Латунь DIN 464, Алмазный бланк)
const matSteel = new THREE.MeshStandardMaterial({ color: 0xdbe2ea, metalness: 0.65, roughness: 0.3 });
const matBaseSteel = new THREE.MeshStandardMaterial({ color: 0xcbd5e1, metalness: 0.6, roughness: 0.35 });
const matDark = new THREE.MeshStandardMaterial({ color: 0x1e293b, metalness: 0.4, roughness: 0.5 });
const matBrass = new THREE.MeshStandardMaterial({ color: 0xeab308, metalness: 0.8, roughness: 0.22 });
const matBlade = new THREE.MeshStandardMaterial({ color: 0xf1f5f9, metalness: 0.85, roughness: 0.15 });
const matDiamond = new THREE.MeshStandardMaterial({ color: 0x94a3b8, metalness: 0.3, roughness: 0.75 });
const matIgus = new THREE.MeshStandardMaterial({ color: 0xca8a04, roughness: 0.4 });
const matRedIndex = new THREE.MeshBasicMaterial({ color: 0xdc2626 });

// Функция добавления детали с четкими черными CAD-ребрами (как в SolidWorks Illustration)
function addCADMesh(geo, mat, parent = scene, castShadow = true) {
  const mesh = new THREE.Mesh(geo, mat);
  mesh.castShadow = castShadow;
  mesh.receiveShadow = true;
  const edges = new THREE.EdgesGeometry(geo, 22);
  const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x0f172a, linewidth: 1.5 }));
  mesh.add(line);
  parent.add(mesh);
  return mesh;
}

// 1. НИЖНЯЯ БАЗОВАЯ ПЛИТА (Лазерная резка 1.4301, 5 мм)
const bottomPlate = addCADMesh(new THREE.BoxGeometry(24, 0.6, 15), matDark);
bottomPlate.position.set(0, 0.3, 0);

// 2. ВЕРХНЯЯ НЕПОДВИЖНАЯ ПЛАСТИНА (Прямой участок паза копира 22.15 мм)
const fixedPlateLeft = addCADMesh(new THREE.BoxGeometry(12.5, 0.65, 4.2), matSteel);
fixedPlateLeft.position.set(-5.5, 0.92, 4.8);

const fixedPlateBack = addCADMesh(new THREE.BoxGeometry(23.6, 0.65, 6.2), matSteel);
fixedPlateBack.position.set(0, 0.92, -3.8);

// 3. ПОВОРОТНОЕ КРЫЛО КОПИРА (Adjustable Cam Wing, вращается вокруг точки "0")
const wingPivot = new THREE.Group();
wingPivot.position.set(0.8, 0.92, 2.0); // Точка "0" (начало подъема к острию)
scene.add(wingPivot);

// Осевой штифт крыла в точке "0"
const pivotPin = addCADMesh(new THREE.CylinderGeometry(0.45, 0.45, 1.0, 24), matBrass, wingPivot);

// Внутренняя и внешняя дуги поворотного паза шириной 22.15 мм
const wingInner = addCADMesh(new THREE.BoxGeometry(9.2, 0.65, 2.2), matBaseSteel, wingPivot);
wingInner.position.set(4.6, 0, -1.3);

const wingOuter = addCADMesh(new THREE.BoxGeometry(9.2, 0.65, 2.2), matBaseSteel, wingPivot);
wingOuter.position.set(4.6, 0, 2.9);

const wingEndCap = addCADMesh(new THREE.BoxGeometry(1.6, 0.65, 6.4), matBaseSteel, wingPivot);
wingEndCap.position.set(9.2, 0, 0.8);

// Латунный винт-барашек DIN 464 фиксации угла поворота крыла по шкале (0°..35°)
const wingLockStud = addCADMesh(new THREE.CylinderGeometry(0.32, 0.32, 1.4, 20), matSteel, wingPivot);
wingLockStud.position.set(8.5, 0.6, 2.8);
const wingThumbScrew = addCADMesh(new THREE.CylinderGeometry(0.85, 0.85, 0.55, 28), matBrass, wingPivot);
wingThumbScrew.position.set(8.5, 1.35, 2.8);

// 4. КАРЕТКА В ПАЗУ: Подшипник S608-2RS (Ø22 мм) + Шарнир Gelenkkopf M8
const carriageGroup = new THREE.Group();
carriageGroup.position.set(3.2, 1.1, 2.5);
scene.add(carriageGroup);

const bearingS608 = addCADMesh(new THREE.CylinderGeometry(1.35, 1.35, 0.55, 32), matSteel, carriageGroup);
const bearingInner = addCADMesh(new THREE.CylinderGeometry(0.6, 0.6, 0.6, 24), matDark, carriageGroup);

// Стойка с выбором угла заточки (12° / 15° / 18° / 20°) и барашком DIN 464
const anglePost = addCADMesh(new THREE.BoxGeometry(1.1, 4.2, 1.1), matDark, carriageGroup);
anglePost.position.set(0, 2.2, 0);

const angleThumb = addCADMesh(new THREE.CylinderGeometry(0.8, 0.8, 0.5, 28), matBrass, carriageGroup);
angleThumb.rotation.z = Math.PI / 2;
angleThumb.position.set(0.85, 3.6, 0);

// Шарнирная головка Gelenkkopf M8 + Втулка скольжения IGUS RJ4JP-01-08
const rodEnd = addCADMesh(new THREE.CylinderGeometry(0.95, 0.95, 0.8, 24), matSteel, carriageGroup);
rodEnd.rotation.z = Math.PI / 2;
rodEnd.position.set(0, 4.3, 0);

const igusBushing = addCADMesh(new THREE.CylinderGeometry(0.68, 0.68, 2.2, 24), matIgus, carriageGroup);
igusBushing.rotation.x = Math.PI / 2 - 0.26;
igusBushing.rotation.z = -0.32;
igusBushing.position.set(-0.6, 4.3, -0.8);

// 5. МАГНИТНЫЙ ЛОЖЕМЕНТ КЛИНКА + ПРИЦЕЛЬНАЯ РИСКА «0» + КЛИНОК ШЕФ-НОЖА
const magStandGroup = new THREE.Group();
magStandGroup.position.set(-2.2, 0.9, -3.5);
scene.add(magStandGroup);

const standBase = addCADMesh(new THREE.BoxGeometry(11.5, 3.8, 3.8), matDark, magStandGroup);
standBase.position.set(0, 1.9, 0);

const magFace = addCADMesh(new THREE.BoxGeometry(11.6, 3.6, 0.45), matSteel, magStandGroup);
magFace.rotation.x = -0.22;
magFace.position.set(0, 2.1, 1.95);

// 2 неодимовых магнита 40x20x5 N45 с потайными винтами
[-3.0, 3.0].forEach(mx => {
  const mag = addCADMesh(new THREE.BoxGeometry(3.2, 1.6, 0.25), matDark, magStandGroup);
  mag.rotation.x = -0.22;
  mag.position.set(mx, 2.1, 2.15);
});

// Красная прицельная риска «0» (Belly Index Line — совмещается с началом изгиба ножа)
const indexLine = new THREE.Mesh(new THREE.BoxGeometry(0.18, 3.7, 0.3), matRedIndex);
indexLine.rotation.x = -0.22;
indexLine.position.set(3.0, 2.15, 2.15);
magStandGroup.add(indexLine);

// Откидной шаблон вылета режущей кромки (Edge Projection Gauge) с барашком сверху
const edgeGaugeKnob = addCADMesh(new THREE.CylinderGeometry(0.75, 0.75, 0.45, 24), matBrass, magStandGroup);
edgeGaugeKnob.position.set(-1.5, 4.1, 0);

// Клинок шеф-ножа на магните (Прямая часть + криволинейный подъем к острию правее риски «0»)
const bladeShape = new THREE.Shape();
bladeShape.moveTo(-6.5, 0);
bladeShape.lineTo(2.8, 0);
bladeShape.quadraticCurveTo(6.5, 0.1, 9.2, 2.35); // Изгиб к кончику (Belly & Tip)
bladeShape.lineTo(2.5, 2.5);
bladeShape.lineTo(-6.5, 2.4);
bladeShape.closePath();

const bladeGeo = new THREE.ExtrudeGeometry(bladeShape, { depth: 0.18, bevelEnabled: true, bevelThickness: 0.04, bevelSize: 0.08 });
const bladeMesh = addCADMesh(bladeGeo, matBlade, magStandGroup);
bladeMesh.rotation.x = Math.PI - 0.22;
bladeMesh.position.set(0.2, 4.35, 2.55);

// 6. ШТАНГА Ø8 ММ h6 + АЛМАЗНЫЙ БЛАНК 150x20 ММ НА КОНЧИКЕ НОЖА
const rodGroup = new THREE.Group();
rodGroup.position.set(3.2, 5.4, 2.5);
rodGroup.rotation.y = 0.32;
rodGroup.rotation.x = 0.23;
scene.add(rodGroup);

const shaftRod = addCADMesh(new THREE.CylinderGeometry(0.32, 0.32, 19.5, 24), matBlade, rodGroup);
shaftRod.rotation.x = Math.PI / 2;
shaftRod.position.set(0, 0, -3.5);

// Задний ограничитель хода с латунной накаткой
const backStopper = addCADMesh(new THREE.CylinderGeometry(0.75, 0.75, 0.9, 24), matBrass, rodGroup);
backStopper.rotation.x = Math.PI / 2;
backStopper.position.set(0, 0, 5.8);

// Держатель камня и алмазный брусок 150x20 мм
const stoneCarrier = addCADMesh(new THREE.BoxGeometry(1.8, 0.55, 8.6), matBrass, rodGroup);
stoneCarrier.position.set(0, -0.45, -7.2);

const diamondStone = addCADMesh(new THREE.BoxGeometry(1.75, 0.5, 8.2), matDiamond, rodGroup);
diamondStone.position.set(0, -0.95, -7.2);

// Отрисовка инженерного фона (миллиметровка), 3D-модели и выносок ①–⑥ на 2D-холсте
let currentWingDeg = 25;

function renderStaticPoster() {
  wingPivot.rotation.y = -THREE.MathUtils.degToRad(currentWingDeg * 0.55);
  renderer.render(scene, camera);

  // 1. Фон чертежной миллиметровки
  ctx2d.fillStyle = '#f1f5f9';
  ctx2d.fillRect(0, 0, 2400, 1500);

  ctx2d.strokeStyle = '#e2e8f0';
  ctx2d.lineWidth = 1.5;
  for (let x = 0; x < 2400; x += 40) {
    ctx2d.beginPath(); ctx2d.moveTo(x, 0); ctx2d.lineTo(x, 1500); ctx2d.stroke();
  }
  for (let y = 0; y < 1500; y += 40) {
    ctx2d.beginPath(); ctx2d.moveTo(0, y); ctx2d.lineTo(2400, y); ctx2d.stroke();
  }

  ctx2d.strokeStyle = '#cbd5e1';
  ctx2d.lineWidth = 2.5;
  for (let x = 0; x < 2400; x += 200) {
    ctx2d.beginPath(); ctx2d.moveTo(x, 0); ctx2d.lineTo(x, 1500); ctx2d.stroke();
  }
  for (let y = 0; y < 1500; y += 200) {
    ctx2d.beginPath(); ctx2d.moveTo(0, y); ctx2d.lineTo(2400, y); ctx2d.stroke();
  }

  // 2. Наложение 3D-рендера
  ctx2d.drawImage(webglCanvas, 0, 0);

  // 3. Заголовок чертежа
  ctx2d.fillStyle = '#0f172a';
  ctx2d.font = 'bold 42px Segoe UI, sans-serif';
  ctx2d.fillText('КИНЕМАТИЧЕСКАЯ ТОЧИЛКА v2.0 (НАСТРАИВАЕМЫЙ КОПИР α = const)', 70, 85);
  ctx2d.fillStyle = '#475569';
  ctx2d.font = '600 26px Segoe UI, sans-serif';
  ctx2d.fillText(`Исполнение: Плоская лазерная резка 1.4301 (5+6 мм) | Подшипник S608-2RS | Профиль крыла: ${currentWingDeg}°`, 70, 130);

  // 4. Выноски узлов ①–⑥ с линиями-указателями
  const callouts = [
    { num: '1', x: 470, y: 1120, tx: 110, ty: 1280, title: '① Двухслойная база (Лазер 1.4301)', sub: 'Лист 5 мм + Лист 6 мм (паз 22.15 мм без ЧПУ)' },
    { num: '2', x: 1590, y: 1030, tx: 1680, ty: 1250, title: '② Поворотное крыло копира (0°–35°)', sub: 'Подстройка под крутизну изгиба кончика ножа' },
    { num: '3', x: 1360, y: 890, tx: 1720, ty: 940, title: '③ Каретка: Подшипник S608-2RS (Ø22)', sub: 'Катится внутри лазерного паза + шарнир M8' },
    { num: '4', x: 1450, y: 580, tx: 1760, ty: 560, title: '④ Селектор угла (12° / 15° / 18° / 20°)', sub: 'Быстрая фиксация барашком DIN 464 M5' },
    { num: '5', x: 960, y: 620, tx: 90, ty: 380, title: '⑤ Магнитный ложемент + Риска «0»', sub: 'Совмещение начала подъема к острию (длина 6–26 см)' },
    { num: '6', x: 1180, y: 430, tx: 950, ty: 210, title: '⑥ Вал Ø8 мм h6 + Втулка IGUS RJ4JP', sub: 'Алмазный бланк 150×20 мм (защита от пыли)' }
  ];

  callouts.forEach(c => {
    // Линия выноски
    ctx2d.strokeStyle = '#0f172a';
    ctx2d.lineWidth = 3.5;
    ctx2d.beginPath();
    ctx2d.moveTo(c.x, c.y);
    ctx2d.lineTo(c.tx + 240, c.ty - 15);
    ctx2d.stroke();

    // Точка на детали
    ctx2d.fillStyle = '#d97706';
    ctx2d.beginPath();
    ctx2d.arc(c.x, c.y, 12, 0, Math.PI * 2);
    ctx2d.fill();
    ctx2d.strokeStyle = '#fff';
    ctx2d.lineWidth = 3;
    ctx2d.stroke();

    // Плашка описания
    ctx2d.fillStyle = 'rgba(15, 23, 42, 0.94)';
    ctx2d.beginPath();
    ctx2d.roundRect(c.tx, c.ty - 55, 560, 92, 12);
    ctx2d.fill();

    ctx2d.fillStyle = '#fbbf24';
    ctx2d.font = 'bold 25px Segoe UI, sans-serif';
    ctx2d.fillText(c.title, c.tx + 20, c.ty - 18);

    ctx2d.fillStyle = '#f8fafc';
    ctx2d.font = '21px Segoe UI, sans-serif';
    ctx2d.fillText(c.sub, c.tx + 20, c.ty + 18);
  });
}

function setWingAngle(deg, btn) {
  currentWingDeg = deg;
  document.querySelectorAll('.wing-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderStaticPoster();
}

function downloadPNG() {
  const link = document.createElement('a');
  link.download = `sharpener_v2_static_3d_${currentWingDeg}deg.png`;
  link.href = outCanvas.toDataURL('image/png');
  link.click();
}

renderStaticPoster();
</script>
</body>
</html>
