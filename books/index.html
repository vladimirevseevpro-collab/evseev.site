<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Домашняя библиотека</title>
  <style>body{font:16px system-ui,sans-serif;max-width:42rem;margin:12vh auto;padding:1rem;background:#070a13;color:#f8fafc}a{color:#38bdf8}</style>
  <script>
    window.__onEvseevAuthUnlocked = function () {
      var destination = new URL('https://nucbox-k8-plus.tail374af0.ts.net/books/');
      destination.search = window.location.search;
      destination.hash = window.location.hash;
      var params = new URLSearchParams(destination.search);
      if (!params.has('k') && !params.has('token')) {
        try {
          var savedToken = localStorage.getItem('hub_auth');
          if (savedToken) {
            params.set('k', savedToken);
            destination.search = params.toString();
          }
        } catch (error) {}
      }
      var link = document.getElementById('home-link');
      if (link) link.href = destination.href;
      try { window.location.replace(destination.href); }
      catch (error) {
        var st = document.getElementById('status');
        if (st) st.textContent = 'Автоматический переход не сработал. Используйте ссылку выше.';
      }
      window.setTimeout(function () {
        var st = document.getElementById('status');
        if (st) st.textContent = 'Если переход не начался, откройте домашнюю библиотеку по ссылке выше.';
      }, 1800);
    };
  </script>
  <script src="/auth-1978.js"></script>
</head>
<body>
  <main>
    <h1>Домашняя библиотека</h1>
    <p id="status" role="status">Открываем домашнюю библиотеку…</p>
    <p><a id="home-link" href="https://nucbox-k8-plus.tail374af0.ts.net/books/">Перейти в домашнюю библиотеку</a></p>
  </main>
</body>
</html>
